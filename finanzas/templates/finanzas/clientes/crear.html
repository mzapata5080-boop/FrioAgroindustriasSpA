{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h2 class="mb-0">

                Crear Nuevo Cliente

            </h2>

        </div>

        <div class="card-body">

            <form method="post">

                {% csrf_token %}

                <div class="row">

                    <!-- RUT -->

                    <div class="col-md-6 mb-3">

                        <label
                        class="form-label">

                            RUT *

                        </label>

                        <input
                            type="text"
                            name="rut"
                            class="form-control"
                            placeholder="12.345.678-9"
                            required>

                    </div>

                    <!-- Razón Social -->

                    <div class="col-md-6 mb-3">

                        <label
                        class="form-label">

                            Razón Social *

                        </label>

                        <input
                            type="text"
                            name="razon_social"
                            class="form-control"
                            placeholder="Empresa"
                            required>

                    </div>

                </div>

                <div class="row">

                    <!-- Correo -->

                    <div class="col-md-6 mb-3">

                        <label
                        class="form-label">

                            Correo Electrónico

                        </label>

                        <input
                            type="email"
                            name="correo"
                            class="form-control"
                            placeholder="empresa@correo.cl">

                    </div>

                    <!-- Teléfono -->

                    <div class="col-md-6 mb-3">

                        <label
                        class="form-label">

                            Teléfono

                        </label>

                        <input
                            type="text"
                            name="telefono"
                            class="form-control"
                            placeholder="+56 9 1234 5678">

                    </div>

                </div>

                <div class="row">

                    <!-- Dirección -->

                    <div class="col-12 mb-3">

                        <label
                        class="form-label">

                            Dirección

                        </label>

                        <input
                            type="text"
                            name="direccion"
                            class="form-control"
                            placeholder="Av. Principal 123">

                    </div>

                </div>

                <hr>

                <div
                    class="d-flex
                           justify-content-end
                           gap-2">

                    <a
                        href="{% url 'cliente_list' %}"
                        class="btn btn-secondary">

                        Cancelar

                    </a>

                    <button
                        type="submit"
                        class="btn btn-primary">

                        Guardar Cliente

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
