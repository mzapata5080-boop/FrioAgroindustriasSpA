{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-warning text-dark">

            <h2 class="mb-0">

                Editar Cliente

            </h2>

        </div>

        <div class="card-body">

            <form method="post">

                {% csrf_token %}

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            RUT *

                        </label>

                        {{ form.rut }}

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Razón Social *

                        </label>

                        {{ form.razon_social }}

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Correo Electrónico

                        </label>

                        {{ form.correo }}

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Teléfono

                        </label>

                        {{ form.telefono }}

                    </div>

                </div>

                <div class="row">

                    <div class="col-12 mb-3">

                        <label class="form-label">

                            Dirección

                        </label>

                        {{ form.direccion }}

                    </div>

                </div>

                <hr>

                <div class="d-flex justify-content-end gap-2">

                    <a
                        href="{% url 'cliente_list' %}"
                        class="btn btn-secondary">

                        Cancelar

                    </a>

                    <button
                        type="submit"
                        class="btn btn-warning">

                        Actualizar Cliente

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
