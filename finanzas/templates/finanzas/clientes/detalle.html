{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>

                Detalle del Cliente

            </h3>

        </div>

        <div class="card-body">

            <p>

                <strong>RUT:</strong>

                {{ cliente.rut }}

            </p>

            <p>

                <strong>Razón Social:</strong>

                {{ cliente.razon_social }}

            </p>

            <p>

                <strong>Correo:</strong>

                {{ cliente.correo }}

            </p>

            <p>

                <strong>Teléfono:</strong>

                {{ cliente.telefono }}

            </p>

            <p>

                <strong>Dirección:</strong>

                {{ cliente.direccion }}

            </p>

        </div>

    </div>

</div>

{% endblock %}
