{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <div class="card p-4 shadow-sm">
        <h2>Eliminar trabajador</h2>
        <p>¿Está seguro de que desea eliminar al usuario <strong>{{ object.username }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            <a href="{% url 'trabajador_list' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
