{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frío y Agroindustria SpA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Frío y Agroindustria SpA</span>
            {% if user.is_authenticated %}
            <div class="d-flex text-white align-items-center">
                <span class="me-3 d-none d-md-inline">Usuario: {{ user.first_name }} {{ user.last_name }} | Rol: {{ user.rol|title }}</span>
                <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Salir</a>
            </div>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
